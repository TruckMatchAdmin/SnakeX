server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Page de téléchargement de l'APK SnakeX Android
    location /downloads/ {
        alias /var/www/snakex/public/downloads/;
        autoindex on;
    }

    # Reverse proxy vers le serveur de jeu SnakeX Node.js & Socket.IO
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # OPTIMISATIONS GAMING TEMPS RÉEL (Zéro Buffering, TCP No-Delay)
        proxy_buffering off;
        proxy_cache off;
        tcp_nodelay on;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
